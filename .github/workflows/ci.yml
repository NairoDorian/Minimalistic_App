name: "Continuous Integration & Type Check"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate:
    name: "Validate Frontend & Rust Backend"
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-24.04", "macos-latest", "windows-latest" ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux only)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: Install project dependencies
        run: bun install

      - name: Validate TypeScript static types (tsc -b)
        run: bun x tsc -b

      - name: Validate Vite production bundle
        run: bun run vite:build

      - name: Validate Rust compilation (cargo check)
        run: cargo check --manifest-path src-tauri/Cargo.toml
