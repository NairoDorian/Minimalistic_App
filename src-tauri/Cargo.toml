[package]
name = "minimalistic-app"
version = "0.7.0"
description = "Minimalistic cross-platform desktop application based on Tauri 2, Bun, React 19, and TypeScript"
authors = ["Z"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "^2.6.3", features = [] }

[dependencies]
tauri = { version = "^2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "^2.5.1"
tauri-plugin-process = "^2.3.1"
tauri-plugin-single-instance = "^2.4.3"
tauri-plugin-updater = "^2.10.1"
# serde with derive feature is used for AppSettings JSON persistence
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.151"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
