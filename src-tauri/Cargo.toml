[package]
name = "minimalistic-app"
version = "0.19.0"
description = "Minimalistic cross-platform desktop application based on Tauri 2, Bun, SolidJS 2, and TypeScript"
authors = ["Z"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "^2.6.3", features = [] }

[dependencies]
tauri = { version = "^2.11.5", features = ["tray-icon", "specta"] }
tauri-plugin-autostart = "^2.5.1"
tauri-plugin-log = "^2.9.0"
tauri-plugin-notification = "^2.3.3"
tauri-plugin-process = "^2.3.1"
tauri-plugin-single-instance = "^2.4.3"
tauri-plugin-updater = "^2.10.1"
# log facade so backend diagnostics stream to tauri-plugin-log targets (stdout, file, webview)
log = "^0.4.33"
# serde with derive feature is used for AppSettings JSON persistence
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.151"
# specta types + tauri-specta bindings: auto-generates type-safe Rust↔TypeScript IPC
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

[profile.dev.package."*"]
debug = false

