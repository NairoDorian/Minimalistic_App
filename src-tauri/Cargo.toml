[package]
name = "minimalistic-app"
version = "0.20.1"
description = "Minimalistic cross-platform desktop application based on Tauri 2, Bun, SolidJS 2, and TypeScript"
authors = ["Z"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "^2.6.3", features = [] }

[dependencies]
tauri = { version = "^2.11.5", features = ["tray-icon", "specta"] }
tauri-plugin-autostart = "^2.5.1"
tauri-plugin-log = "^2.9.0"
tauri-plugin-notification = "^2.3.3"
tauri-plugin-process = "^2.3.1"
tauri-plugin-single-instance = "^2.4.3"
tauri-plugin-updater = "^2.10.1"
# log facade so backend diagnostics stream to tauri-plugin-log targets (stdout, file, webview)
log = "^0.4.33"
# serde with derive feature is used for AppSettings JSON persistence
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.151"
# specta types + tauri-specta bindings: auto-generates type-safe Rust↔TypeScript IPC
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }

# ── Global hotkey backends (src/hotkeys) ──────────────────────────────────────
# OS keyboard-hook bindings for system-wide shortcuts. These are the only
# dependencies the hotkey module has: its types, parser, error enum, and bitset
# are all hand-written in-tree (no bitflags, no thiserror, no hotkey crate).

[target.'cfg(target_os = "windows")'.dependencies]
# Low-level keyboard hook (WH_KEYBOARD_LL) + session-change notifications.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_RemoteDesktop",
    "Win32_Graphics_Gdi",
    # GetCurrentThreadId — used by the listener's session-change unit tests.
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# CGEventTap-based tap; requires the Accessibility permission at runtime.
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", features = [
    "CGEvent",
    "CGEventTypes",
    "CGEventSource",
    "CGRemoteOperation",
] }
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSApplication"] }
objc2-foundation = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust evdev bindings — no C build step, and identical behaviour on
# Wayland, X11, and the console. uinput is used to re-inject non-blocked keys.
evdev = "0.13"
# poll(2) for the event loop and inotify(7) for device hotplug.
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

[profile.dev.package."*"]
debug = false

# Production release optimizations for the native bundle: minimize binary size
# (download-friendly), LTO + single codegen unit for best optimization, strip
# symbols, and abort on panic (no unwinding tables) — the standard Tauri
# release profile.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

